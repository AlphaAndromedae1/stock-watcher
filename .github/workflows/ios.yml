name: iOS Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: List installed Xcodes
        run: ls /Applications | grep -i Xcode || true

      - name: Select Xcode 15
        run: |
          if [ -d /Applications/Xcode_15.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: StockWatcher
        run: xcodegen generate

      - name: Build app + widget (generic iOS, unsigned)
        working-directory: StockWatcher
        run: |
          set -o pipefail
          xcodebuild \
            -project StockWatcher.xcodeproj \
            -scheme StockWatcher \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean build

      - name: Upload unsigned .app
        uses: actions/upload-artifact@v4
        with:
          name: StockWatcher-app-unsigned
          path: StockWatcher/build/DD/Build/Products/Debug-iphoneos/*.app
          if-no-files-found: warn

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available \
                 | grep -Eo 'iPhone[^(]*\(([0-9A-Fa-f-]{36})\)' \
                 | grep -Eo '[0-9A-Fa-f-]{36}' | head -1)
          if [ -z "$UDID" ]; then
            echo "No iPhone simulator found"; exit 1
          fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests (simulator)
        working-directory: StockWatcher
        run: |
          set -o pipefail
          xcodebuild \
            -project StockWatcher.xcodeproj \
            -scheme StockWatcher \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO \
            test

  # ---------------------------------------------------------------------------
  # Optional: a signed .ipa for TestFlight / ad-hoc install. Requires an Apple
  # Developer account + signing secrets, so it's disabled by default. To enable:
  #   1. Add your signing (App Store Connect API key or cert/profile) as secrets.
  #   2. Fill scripts/ExportOptions.sample.plist (teamID + method) -> ExportOptions.plist.
  #   3. Change the `if:` below to: github.ref == 'refs/heads/main'
  # ---------------------------------------------------------------------------
  archive-ipa:
    runs-on: macos-14
    if: ${{ false }}
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: StockWatcher
        run: xcodegen generate
      - name: Archive
        working-directory: StockWatcher
        run: |
          xcodebuild -project StockWatcher.xcodeproj \
            -scheme StockWatcher \
            -configuration Release \
            -archivePath build/StockWatcher.xcarchive \
            -destination 'generic/platform=iOS' \
            archive
      - name: Export IPA
        working-directory: StockWatcher
        run: |
          xcodebuild -exportArchive \
            -archivePath build/StockWatcher.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ../scripts/ExportOptions.sample.plist
      - uses: actions/upload-artifact@v4
        with:
          name: StockWatcher-ipa
          path: StockWatcher/build/ipa/*.ipa
