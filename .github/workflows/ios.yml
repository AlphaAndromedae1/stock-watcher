name: iOS Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: StockWatcher
        run: xcodegen generate

      - name: Build & test (iOS Simulator, no signing)
        working-directory: StockWatcher
        run: |
          set -o pipefail
          xcodebuild \
            -project StockWatcher.xcodeproj \
            -scheme StockWatcher \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            clean build test | xcbeautify || xcodebuild \
            -project StockWatcher.xcodeproj \
            -scheme StockWatcher \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            clean build test

  # ---------------------------------------------------------------------------
  # Optional: build a signed .ipa for TestFlight / ad-hoc install.
  # Requires repository secrets for an App Store Connect API key or certs.
  # Left disabled by default — enable by setting the secrets and the `if:` below.
  # ---------------------------------------------------------------------------
  archive-ipa:
    runs-on: macos-14
    if: ${{ false }}   # set to github.ref == 'refs/heads/main' once signing is configured
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: StockWatcher
        run: xcodegen generate
      - name: Archive
        working-directory: StockWatcher
        run: |
          xcodebuild -project StockWatcher.xcodeproj \
            -scheme StockWatcher \
            -configuration Release \
            -archivePath build/StockWatcher.xcarchive \
            -destination 'generic/platform=iOS' \
            archive
      - name: Export IPA
        working-directory: StockWatcher
        run: |
          xcodebuild -exportArchive \
            -archivePath build/StockWatcher.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ../scripts/ExportOptions.sample.plist
      - uses: actions/upload-artifact@v4
        with:
          name: StockWatcher-ipa
          path: StockWatcher/build/ipa/*.ipa
